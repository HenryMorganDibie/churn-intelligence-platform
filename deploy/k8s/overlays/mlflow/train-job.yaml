# Trains, logs to MLflow, registers a version and applies the champion/challenger gate.
# Re-run with: kubectl -n churn delete job churn-train && kubectl apply -k deploy/k8s/overlays/mlflow
apiVersion: batch/v1
kind: Job
metadata:
  name: churn-train
  labels: {app.kubernetes.io/name: churn-train, app.kubernetes.io/part-of: churn-intelligence}
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: churn-train}
    spec:
      restartPolicy: Never
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      initContainers:
        - name: wait-for-mlflow
          image: churn-intelligence:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-c", "import time,urllib.request\nfor _ in range(120):\n    try:\n        urllib.request.urlopen('http://mlflow:5000/health'); break\n    except Exception:\n        time.sleep(2)\nelse:\n    raise SystemExit('mlflow not reachable')"]
      containers:
        - name: train
          image: churn-intelligence:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.models.trainer"]
          env:
            - {name: MLFLOW_ENABLED, value: "true"}
            - {name: MLFLOW_TRACKING_URI, value: "http://mlflow:5000"}
            - {name: MODEL_PATH, value: /tmp/churn_model.pkl}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
